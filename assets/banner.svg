<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4e00"/>
      <stop offset="100%" style="stop-color:#ff8c42"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4e00;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textglow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2a3a" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.4"/>

  <!-- Decorative circuit lines -->
  <line x1="0" y1="60" x2="300" y2="60" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="300" y1="60" x2="320" y2="80" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="320" y1="80" x2="420" y2="80" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="420" cy="80" r="3" fill="#ff4e00" opacity="0.6"/>

  <line x1="1200" y1="340" x2="900" y2="340" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="900" y1="340" x2="880" y2="320" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="880" y1="320" x2="780" y2="320" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="780" cy="320" r="3" fill="#ff4e00" opacity="0.6"/>

  <line x1="0" y1="340" x2="150" y2="340" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="150" cy="340" r="3" fill="#1e5a8f" opacity="0.6"/>

  <line x1="1200" y1="60" x2="1050" y2="60" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="1050" cy="60" r="3" fill="#1e5a8f" opacity="0.6"/>

  <!-- Shield Icon -->
  <g transform="translate(90, 120)" filter="url(#glow)">
    <path d="M60 0 L120 25 L120 70 Q120 110 60 130 Q0 110 0 70 L0 25 Z" fill="url(#shield)" opacity="0.15"/>
    <path d="M60 5 L115 28 L115 70 Q115 106 60 124 Q5 106 5 70 L5 28 Z" fill="none" stroke="#ff4e00" stroke-width="1.5" opacity="0.8"/>
    <!-- Checkmark inside shield -->
    <polyline points="30,70 50,90 90,50" fill="none" stroke="#ff6b35" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Glowing accent bar -->
  <rect x="230" y="155" width="4" height="100" fill="url(#accent)" rx="2" filter="url(#glow)"/>

  <!-- Main Title -->
  <text x="255" y="195" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="#ffffff" filter="url(#textglow)" letter-spacing="2">
    FortiGate
  </text>
  <text x="255" y="245" font-family="'Courier New', monospace" font-size="28" fill="url(#accent)" letter-spacing="4">
    FIREWALL SECURITY LAB
  </text>

  <!-- Subtitle line -->
  <text x="255" y="280" font-family="'Courier New', monospace" font-size="14" fill="#4a7fa5" letter-spacing="1">
    Advanced Network Security  ·  NUCES (FAST) Islamabad  ·  MS Cybersecurity
  </text>

  <!-- Tag pills -->
  <rect x="255" y="300" width="120" height="26" rx="13" fill="#ff4e00" opacity="0.15" stroke="#ff4e00" stroke-width="1"/>
  <text x="315" y="317" font-family="'Courier New', monospace" font-size="11" fill="#ff6b35" text-anchor="middle" letter-spacing="1">FortiGate VM</text>

  <rect x="385" y="300" width="100" height="26" rx="13" fill="#1e5a8f" opacity="0.2" stroke="#1e5a8f" stroke-width="1"/>
  <text x="435" y="317" font-family="'Courier New', monospace" font-size="11" fill="#4a9fd4" text-anchor="middle" letter-spacing="1">DoS Policy</text>

  <rect x="495" y="300" width="110" height="26" rx="13" fill="#1a5c3a" opacity="0.2" stroke="#27ae60" stroke-width="1"/>
  <text x="550" y="317" font-family="'Courier New', monospace" font-size="11" fill="#2ecc71" text-anchor="middle" letter-spacing="1">Web Filter</text>

  <rect x="615" y="300" width="110" height="26" rx="13" fill="#4a1a6a" opacity="0.2" stroke="#9b59b6" stroke-width="1"/>
  <text x="670" y="317" font-family="'Courier New', monospace" font-size="11" fill="#b77de8" text-anchor="middle" letter-spacing="1">NAT Policy</text>

  <!-- Right side decorative element: network topology nodes -->
  <g transform="translate(870, 80)" opacity="0.7">
    <!-- Internet cloud node -->
    <circle cx="160" cy="40" r="22" fill="none" stroke="#ff4e00" stroke-width="1.5"/>
    <text x="160" y="37" font-family="'Courier New', monospace" font-size="8" fill="#ff6b35" text-anchor="middle">INTERNET</text>
    <text x="160" y="48" font-family="'Courier New', monospace" font-size="7" fill="#ff4e00" text-anchor="middle">8.8.8.8</text>

    <!-- Line: Internet to FortiGate -->
    <line x1="138" y1="50" x2="110" y2="110" stroke="#ff4e00" stroke-width="1.2" stroke-dasharray="4,3"/>

    <!-- FortiGate node -->
    <rect x="70" y="110" width="80" height="36" rx="4" fill="none" stroke="#ff6b35" stroke-width="1.5"/>
    <text x="110" y="125" font-family="'Courier New', monospace" font-size="9" fill="#ff6b35" text-anchor="middle">FORTIGATE</text>
    <text x="110" y="138" font-family="'Courier New', monospace" font-size="7" fill="#ff4e00" text-anchor="middle">192.168.134.10</text>

    <!-- Line: FortiGate to switch -->
    <line x1="110" y1="146" x2="110" y2="185" stroke="#4a9fd4" stroke-width="1.2"/>

    <!-- Switch node -->
    <rect x="75" y="185" width="70" height="28" rx="4" fill="none" stroke="#4a9fd4" stroke-width="1.2"/>
    <text x="110" y="203" font-family="'Courier New', monospace" font-size="9" fill="#4a9fd4" text-anchor="middle">LAN SWITCH</text>

    <!-- Client nodes -->
    <line x1="90" y1="213" x2="60" y2="250" stroke="#2ecc71" stroke-width="1"/>
    <line x1="110" y1="213" x2="110" y2="250" stroke="#2ecc71" stroke-width="1"/>
    <line x1="130" y1="213" x2="160" y2="250" stroke="#2ecc71" stroke-width="1"/>

    <circle cx="60" cy="260" r="12" fill="none" stroke="#2ecc71" stroke-width="1.2"/>
    <text x="60" y="263" font-family="'Courier New', monospace" font-size="7" fill="#2ecc71" text-anchor="middle">PC</text>

    <circle cx="110" cy="260" r="12" fill="none" stroke="#b77de8" stroke-width="1.2"/>
    <text x="110" y="263" font-family="'Courier New', monospace" font-size="7" fill="#b77de8" text-anchor="middle">KALI</text>

    <circle cx="160" cy="260" r="12" fill="none" stroke="#2ecc71" stroke-width="1.2"/>
    <text x="160" y="263" font-family="'Courier New', monospace" font-size="7" fill="#2ecc71" text-anchor="middle">VM</text>

    <!-- WAN label -->
    <text x="155" y="85" font-family="'Courier New', monospace" font-size="8" fill="#ff4e00" opacity="0.6">WAN</text>
    <text x="70" y="175" font-family="'Courier New', monospace" font-size="8" fill="#4a9fd4" opacity="0.6">LAN</text>
  </g>

  <!-- Bottom border accent -->
  <rect x="0" y="390" width="1200" height="4" fill="url(#accent)" opacity="0.6"/>
  <!-- Top border accent -->
  <rect x="0" y="6" width="1200" height="2" fill="#1e3a5f" opacity="0.8"/>
</svg>
